# Pod Security Admission for the services namespace (user workloads).
#
# ROLE: defense in depth against a compromised extension account or a
# future bug in the deploy path — the admission controller rejects
# `privileged`, `hostPath`, `hostNetwork`, host PIDs/IPC and host ports
# AT ADMISSION, no matter what pod template reaches the API server.
#
# Verified against the live cluster before writing this manifest: NO
# stateful set or deployment pod template in the namespace uses any of
# those features (checked: privileged, hostPath, hostNetwork/PID/IPC,
# hostPorts, SYS_ADMIN caps) — `baseline` is safe to enforce.
#
# STAGED ROLLOUT (reversible at every step, affects only NEW pods):
#   1. Apply this file as-is: `warn` and `audit` are active, `enforce`
#      is commented out. Existing pods are never affected by PSA.
#   2. IMPORTANT (verified on this cluster): audit-mode results are
#      annotations on the API-server AUDIT LOG event — this cluster has
#      no audit policy configured, so audit mode is a no-op here. The
#      `warn` output is only visible to the client that performs the
#      create, and users deploy through the extension, which drops API
#      response warnings. The practical staging check is therefore a
#      scan over the STORED workload templates (empty output = nothing
#      would violate enforce):
#
#        kubectl get sts,deploy -n services -o json | jq -r '
#          .items[] | .kind as $k | .metadata.name as $n | (.spec.template.spec) |
#          (if .hostNetwork or .hostPID or .hostIPC then "\($k)/\($n): host namespaces" else empty end),
#          ((.volumes // [])[]? | select(.hostPath) | "\($k)/\($n): hostPath \(.name)"),
#          (.containers[]? | select(.securityContext.privileged == true) | "\($k)/\($n): privileged \(.name)"),
#          (.containers[]? | ((.ports // [])[]? | select(.hostPort) | "\($k)/\($n): hostPort \(.name)"))'
#
#   3. When the scan stays empty (the extension's whitelist builder
#      cannot produce violating templates anyway), uncomment
#      `enforce: baseline` and re-apply. From then on, violations are
#      rejected at admission — visible as a clear PSA error in the
#      extension's deploy error response.
#
# `restricted` would likely reject legitimate ML images (writable root
# filesystems); it is deliberately NOT set for enforce. If you want its
# signal, add `pod-security.kubernetes.io/audit: restricted`.
#
# NOTE: user containers are additionally hardened by the extension
# itself (no service account token, RuntimeDefault seccomp, dropped
# capabilities, runAsNonRoot with a runAsRoot opt-out) — see README
# "Container hardening". This manifest protects against the deploy
# path being bypassed entirely.
---
apiVersion: v1
kind: Namespace
metadata:
  name: services
  labels:
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
    # Uncomment after a quiet warn/audit period:
    # pod-security.kubernetes.io/enforce: baseline
